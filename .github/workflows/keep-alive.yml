name: Keep backend awake

# Railway's free/Hobby plan puts the backend to sleep after a period of no
# traffic, forcing the next real request to pay a cold-start delay. Disabling
# that requires a paid Railway plan; until then, ping the health endpoint on
# a schedule so the container never goes idle long enough to sleep. Runs on
# GitHub's own runners, so it works even when no local machine is on.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Keeping api.safeshoulder.com warm"
          curl -fsS --max-time 20 https://api.safeshoulder.com/health
